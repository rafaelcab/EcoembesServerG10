spring.application.name=EcoembesServer
server.port=8080

# Base de datos H2
spring.datasource.url=jdbc:h2:mem:ecoembesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.show-sql=true

# Configuración Arquitectura TW2 (Servidores Externos)
external.plassb.url=http://localhost:8081
external.contsocket.host=localhost
external.contsocket.port=9090